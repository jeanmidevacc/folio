name: Publish

# Publishes to PyPI on a GitHub Release, using Trusted Publishing (OIDC) — no
# API tokens or repository secrets. Run manually (workflow_dispatch) to push a
# build to TestPyPI first.
#
# One-time setup on PyPI (and TestPyPI):
#   Account → Publishing → Add a pending publisher
#     PyPI project name:  briefing
#     Owner:              jeanmidevacc
#     Repository name:     folio
#     Workflow filename:   publish.yml
#     Environment name:    pypi        (testpypi for the TestPyPI publisher)
# And in this repo: Settings → Environments → create "pypi" and "testpypi".

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Tag must match package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -Po '^__version__ = "\K[^"]+' src/briefing/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version   release tag: $tag"
          test "$version" = "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/briefing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/briefing
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
