[build-system]
# <1.27 keeps the built metadata at version 2.3. 1.27+ emits 2.4/2.5, which
# current `twine check` and some install toolchains still reject.
requires = ["hatchling>=1.21,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bulletin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bulletin"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bulletin",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "noxfile.py",
    "pyproject.toml",
]

[project]
name = "bulletin"
dynamic = ["version"]
description = "Build beautiful self-contained HTML reports from Python analysis"
readme = "README.md"
requires-python = ">=3.11"
# Kept as a text table (not the PEP 639 SPDX string) so the built metadata stays
# at version 2.2 — `twine check` and older toolchains choke on metadata 2.4/2.5.
license = { text = "Apache-2.0" }
authors = [{ name = "jeanmidevacc" }]
keywords = ["data", "reporting", "html", "pandas", "polars", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
# The core install has ZERO visualisation-library dependencies. It renders the
# report grammar (Text, Table, BigNumber, layout, ...) with only Jinja2 +
# markdown-it-py. Charts come from either the `Plot` block (bring your own
# Plotly/Altair/Matplotlib/Bokeh figure — install the matching extra) or the
# `bulletin.lab` custom-visualisation blocks (`pip install bulletin[lab]`).
# Table/DataTable use pandas as the internal engine — `pip install bulletin[pandas]`
# (other dataframe libraries are accepted as input and converted).
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.urls]
Homepage = "https://github.com/jeanmidevacc/folio"
Repository = "https://github.com/jeanmidevacc/folio"
Issues = "https://github.com/jeanmidevacc/folio/issues"
Changelog = "https://github.com/jeanmidevacc/folio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# pip install bulletin[pandas] — internal engine for Table / DataTable
pandas = ["pandas>=2.0"]
# pip install bulletin[lab] — bulletin.lab custom-visualisation blocks
#   (DataProfile, DataDive). Pure-SVG today; grows here so the core grammar
#   stays small.
lab = ["pandas>=2.0"]
# The `Plot` block is a bring-your-own-figure escape hatch. Install the plotting
# library you actually use; bulletin never imports one unless you pass its figure.
plotly = ["plotly>=5.0"]
altair = ["altair>=5.0"]
bokeh = ["bokeh>=3.0"]
matplotlib = ["matplotlib>=3.7"]
# pip install bulletin[charts] — every supported Plot backend at once
charts = ["plotly>=5.0", "altair>=5.0", "bokeh>=3.0", "matplotlib>=3.7"]
# pip install bulletin[email]
email = [
    "premailer>=3.10",
    "kaleido>=0.2",
]
# pip install bulletin[dev]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-snapshot>=0.9",
    "beautifulsoup4>=4.12",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "nox>=2024.4",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pyarrow>=15.0",
    # exercised by the Plot renderer tests so the adapter branches are covered
    "plotly>=5.0",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bulletin --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/bulletin"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
# The renderers build HTML as aligned multi-line f-strings; 120 keeps those
# readable without a wholesale reformat.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally poke deprecated / dynamic attributes.
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional plotting / markdown libraries ship no (or partial) type information.
[[tool.mypy.overrides]]
module = [
    "plotly.*", "altair.*", "bokeh.*", "matplotlib.*", "seaborn.*", "plotnine.*",
    "markdown_it.*", "bs4.*",
]
ignore_missing_imports = true

# Tests: still type-checked, but pytest functions need not be annotated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
