[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulletin"]

[project]
name = "bulletin"
version = "0.1.0"
description = "Build beautiful self-contained HTML reports from Python analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["data", "reporting", "html", "pandas", "polars", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Core install is dataframe-library agnostic. Table/DataTable/DataProfile/
# DataDive need pandas as the internal engine — `pip install bulletin[pandas]`
# (other libraries are accepted as input and converted).
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# pip install bulletin[pandas]
pandas = ["pandas>=2.0"]
# pip install bulletin[email]
email = [
    "premailer>=3.10",
    "kaleido>=0.2",
]
# pip install bulletin[dev]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-snapshot>=0.9",
    "beautifulsoup4>=4.12",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pyarrow>=15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bulletin --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/bulletin"]
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
# The renderers build HTML as aligned multi-line f-strings; 120 keeps those
# readable without a wholesale reformat.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally poke deprecated / dynamic attributes.
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional plotting / markdown libraries ship no type information.
[[tool.mypy.overrides]]
module = ["plotly.*", "altair.*", "bokeh.*", "markdown_it.*", "bs4.*"]
ignore_missing_imports = true

# Tests: still type-checked, but pytest functions need not be annotated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
